[project]
name = "mipcc-iis-checker"
version = "1.0.0b3"
description = "MIP Competition 2027 IIS solution checker"
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
authors = [{ name = "MIP Competition Committee" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/mixedinteger/MIPcc27"
Issues = "https://github.com/mixedinteger/MIPcc27/issues"
Competition = "https://www.mixedinteger.org/2027/competition"

[project.optional-dependencies]
scip = [
    "pyscipopt>=5.0",
]
gurobi = [
    "gurobipy>=11.0",
]
highs = [
    "highspy>=1.7",
]
solvers = [
    "pyscipopt>=5.0",
    "gurobipy>=11.0",
    "highspy>=1.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mipcc-iis-checker = "mipcc_iis_checker.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mipcc_iis_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
